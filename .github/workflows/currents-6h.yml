name: Currents Every 6 Hours

on:
  schedule:
    # كل 6 ساعات بالضبط (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:   # يسمح بتشغيل يدوي من تبويب Actions للتجربة

permissions:
  contents: write

jobs:
  run-currents-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install xarray netCDF4 numpy copernicusmarine

      - name: Run currents pipeline
        env:
          CMEMS_USERNAME: ${{ secrets.CMEMS_USERNAME }}
          CMEMS_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
        run: python scripts/ci_currents_pipeline.py

      - name: Commit and push results
        run: |
          git config user.name "currents-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add currents/ current50.geojson version.json
          git diff --cached --quiet && echo "لا يوجد تغييرات جديدة" || git commit -m "تحديث تلقائي ساعي للتيارات $(date -u +%Y-%m-%dT%H:%M)"
          git push
