name: SSH Daily Pipeline

on:
  schedule:
    # 08:00 UTC = 09:00 بتوقيت الجزائر (UTC+1، بدون توقيت صيفي) — موعد البداية المطلوب.
    # مع منطق إعادة المحاولة داخل ci_ssh_pipeline.py (11 محاولة كل 30 دقيقة)،
    # التغطية الفعلية تمتد حتى ~14:00 محليًا حتى لو تأخرت البيانات.
    - cron: '0 8 * * *'
  workflow_dispatch:   # يسمح بتشغيل يدوي من تبويب Actions للتجربة

permissions:
  contents: write   # لازم عشان الخطوة الأخيرة تقدر تسوي commit/push

jobs:
  run-ssh-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install xarray netCDF4 numpy matplotlib copernicusmarine

      - name: Run SSH pipeline
        env:
          CMEMS_USERNAME: ${{ secrets.CMEMS_USERNAME }}
          CMEMS_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
        run: python scripts/ci_ssh_pipeline.py

      - name: Commit and push results
        run: |
          git config user.name "ssh-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ssh.geojson version.json
          git diff --cached --quiet && echo "لا يوجد تغييرات جديدة" || git commit -m "تحديث تلقائي سحابي لبيانات ارتفاع سطح البحر $(date +%F)"
          git push
