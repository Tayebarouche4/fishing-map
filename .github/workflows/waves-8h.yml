name: Waves Every 8 Hours

on:
  schedule:
    # كل 8 ساعات بالضبط (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch:  # يسمح بتشغيل يدوي من تبويب Actions للتجربة

permissions:
  contents: write

jobs:
  run-waves-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install xarray netCDF4 numpy copernicusmarine matplotlib

      - name: Run waves pipeline
        env:
          CMEMS_USERNAME: ${{ secrets.CMEMS_USERNAME }}
          CMEMS_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
        run: python scripts/ci_waves_pipeline.py

      - name: Commit and push results
        run: |
          git config user.name "waves-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add weather/waves_5d.png version.json
          git diff --cached --quiet && echo "لا يوجد تغييرات جديدة" || git commit -m "تحديث تلقائي (كل 8 ساعات) للأمواج $(date -u +%Y-%m-%dT%H:%M)"

          # إعادة محاولة الرفع مع سحب أي تغييرات جاءت من ووركفلو آخر (التيارات مثلاً)
          # اشتغل في نفس اللحظة ودفع قبلنا — نتفادى فشل push بسبب "fetch first"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "تم الرفع بنجاح"
              break
            fi
            echo "فشل الرفع (محاولة $i) — جاري السحب وإعادة المحاولة..."
            git pull --rebase --autostash origin main
            sleep 5
          done
